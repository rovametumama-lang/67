
name: 67 Android APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - '67-android-game-optimizer.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q 67-android-game-optimizer.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró settings.gradle.kts"
            exit 1
          fi
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug
          mkdir -p output
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/app-debug.apk output/67.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 67-GAME-OPTIMIZER-APK
          path: output/67.apk
          
