name: 67 Android APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - '67-android-game-optimizer.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip 67-android-game-optimizer.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: 67-android-game-optimizer
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: 67-GAME-OPTIMIZER-APK
          path: 67-android-game-optimizer/app/build/outputs/apk/debug/app-debug.apk
